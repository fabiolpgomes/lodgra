name: Sync Production → Staging Database

on:
  # Run daily at 02:00 UTC (outside peak usage)
  schedule:
    - cron: '0 2 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      skip_sanitize:
        description: 'Skip data sanitization (use with caution)'
        required: false
        default: 'false'

jobs:
  sync-database:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify staging credentials
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL_PROD }}" ]; then
            echo "❌ Missing SUPABASE_DB_URL_PROD secret"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_DB_URL_STAGING }}" ]; then
            echo "❌ Missing SUPABASE_DB_URL_STAGING secret"
            exit 1
          fi
          echo "✅ Credentials verified"

      - name: Run sync script
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
          SUPABASE_DB_URL_STAGING: ${{ secrets.SUPABASE_DB_URL_STAGING }}
        run: |
          chmod +x ./scripts/sync-prod-to-staging.sh
          ./scripts/sync-prod-to-staging.sh

      - name: Verify staging database
        env:
          SUPABASE_DB_URL_STAGING: ${{ secrets.SUPABASE_DB_URL_STAGING }}
        run: |
          echo "Verifying staging database..."
          psql "${{ secrets.SUPABASE_DB_URL_STAGING }}" -c "\dt" | head -20
          echo "✅ Staging database is accessible"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Staging sync completed successfully"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // This workflow runs on a schedule or manual dispatch, so most of
            // the time there is no issue/PR in context. The old code assumed
            // context.issue.number always existed, which caused a 404 on
            // /issues//comments and masked the real failure reason.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            core.error(`❌ Staging sync failed. Check the workflow run: ${runUrl}`);

            if (context.issue && context.issue.number) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ Staging sync failed. Check workflow logs: ${runUrl}`
              });
            }

  # Optional: Run smoke tests on staging after sync
  smoke-test:
    needs: sync-database
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
        run: npm run build

      - name: Verify build
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful"
            du -sh .next
          else
            echo "❌ Build failed"
            exit 1
          fi

  # Notification
  notify:
    needs: [sync-database, smoke-test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Set status
        id: status
        run: |
          if [ "${{ needs.sync-database.result }}" = "success" ] && [ "${{ needs.smoke-test.result }}" = "success" ]; then
            echo "status=✅ All checks passed" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ Some checks failed" >> $GITHUB_OUTPUT
          fi

      - name: Output summary
        run: |
          echo "## Staging Sync Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Database Sync | ${{ needs.sync-database.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Staging URL:** https://staging.lodgra.io" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
